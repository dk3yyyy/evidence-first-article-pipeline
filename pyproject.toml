[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-first-article-pipeline"
version = "0.3.0"
description = "A deterministic, evidence-first workflow for agent-assisted technical articles."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Joshua Nwachinemere"}]
keywords = ["writing", "research", "citations", "ai-agents", "editorial"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Text Processing :: Markup :: Markdown",
]

[project.scripts]
article-pipeline = "article_pipeline.cli:main"

[project.optional-dependencies]
dev = [
  "coverage>=7.15,<8",
  "mypy>=2.3,<2.4",
  "ruff>=0.16,<0.17",
]

[tool.setuptools.package-data]
article_pipeline = ["templates/**/*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true

[tool.coverage.run]
source = ["article_pipeline"]
omit = ["article_pipeline/cli.py"]

[tool.coverage.report]
show_missing = true
fail_under = 80
