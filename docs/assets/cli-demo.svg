<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Evidence-First Article Pipeline command-line demo</title>
  <desc id="desc">A dark terminal window shows the init and validate commands creating eleven package files and passing required-file, draft-status and article-structure checks.</desc>
  <rect width="1200" height="520" rx="24" fill="#09111f"/>
  <rect x="1" y="1" width="1198" height="518" rx="23" fill="none" stroke="#26364d" stroke-width="2"/>
  <circle cx="42" cy="38" r="8" fill="#ff6b6b"/><circle cx="68" cy="38" r="8" fill="#ffd166"/><circle cx="94" cy="38" r="8" fill="#06d6a0"/>
  <text x="1120" y="45" text-anchor="end" fill="#7f91aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">article-pipeline</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24">
    <text x="42" y="102" fill="#5eead4">$</text><text x="72" y="102" fill="#e6edf7">article-pipeline init my-article</text>
    <text x="42" y="146" fill="#93a4bb">{ "pass": true, "created": 11 }</text>
    <text x="42" y="214" fill="#5eead4">$</text><text x="72" y="214" fill="#e6edf7">article-pipeline validate my-article</text>
    <text x="42" y="258" fill="#93a4bb">{</text>
    <text x="72" y="302" fill="#93a4bb">"pass":</text><text x="196" y="302" fill="#5eead4">true</text><text x="250" y="302" fill="#93a4bb">,</text>
    <text x="72" y="346" fill="#93a4bb">"checks": {</text>
    <text x="104" y="390" fill="#93a4bb">"required_files":</text><text x="355" y="390" fill="#5eead4">true</text><text x="409" y="390" fill="#93a4bb">,</text>
    <text x="104" y="434" fill="#93a4bb">"draft_status_present":</text><text x="439" y="434" fill="#5eead4">true</text>
    <text x="72" y="478" fill="#93a4bb">} }</text>
  </g>
</svg>